name: APR BANK CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  project-validation:
    name: Project Structure Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate project files
        run: |
          test -f README.md
          test -f .gitignore
          test -f docker-compose.yml
          test -f .env.example

          echo "APR BANK project structure validated."

      - name: Validate Docker Compose configuration
        env:
          DB_PASSWORD: ci-validation-only-not-a-real-secret
        run: docker compose config --quiet
